mid" x="819" y="276" >11 st</text><rect class="fillMint" x="858" y="210" width="54" height="88" rx="8"/><text class="label mid" x="885" y="245" >P8</text><text class="small mid" x="885" y="276" >12 st</text><line class="arrow" x1="92" y1="350" x2="884" y2="350" /><text class="small mid" x="492" y="378" >transpose changes the root, not these interval names</text><text class="small" x="72" y="444" >Example: &lt;3&gt; means the third scale degree; M3 means exactly four semitones above root.</text>
