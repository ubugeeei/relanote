" x1="90" y1="274" x2="90" y2="346" /><text class="small mid" x="90" y="364" >0</text><circle class="mintf" cx="90" cy="310" r="12"/><line class="axis fade" x1="152" y1="274" x2="152" y2="346" /><text class="small mid" x="152" y="364" >1</text><line class="axis fade" x1="214" y1="274" x2="214" y2="346" /><text class="small mid" x="214" y="364" >2</text><circle class="mintf" cx="214" cy="310" r="12"/><line class="axis fade" x1="276" y1="274" x2="276" y2="346" /><text class="small mid" x="276" y="364" >3</text><circle class="hotf" cx="276" cy="310" r="15"/><line class="axis fade" x1="338" y1="274" x2="338" y2="346" /><text class="small mid" x="338" y="364" >4</text><line class="axis fade" x1="400" y1="274" x2="400" y2="346" /><text class="small mid" x="400" y="364" >5</text><circle class="mintf" cx="400" cy="310" r="12"/><line class="axis fade" x1="462" y1="274" x2="462" y2="346" /><text class="small mid" x="462" y="364" >6</text><line class="axis fade" x1="524" y1="274" x2="524" y2="346" /><text class="small mid" x="524" y="364" >7</text><circle class="mintf" cx="524" cy="310" r="12"/><line class="axis fade" x1="586" y1="274" x2="586" y2="346" /><text class="small mid" x="586" y="364" >8</text><circle class="hotf" cx="586" cy="310" r="15"/><line class="axis fade" x1="648" y1="274" x2="648" y2="346" /><text class="small mid" x="648" y="364" >9</text><line class="axis fade" x1="710" y1="274" x2="710" y2="346" /><text class="small mid" x="710" y="364" >10</text><circle class="hotf" cx="710" cy="310" r="15"/><line class="axis fade" x1="772" y1="274" x2="772" y2="346" /><text class="small mid" x="772" y="364" >11</text><line class="axis fade" x1="834" y1="274" x2="834" y2="346" /><text class="small mid" x="834" y="364" >12</text><circle class="mintf" cx="834" cy="310" r="12"/><text class="small mid" x="396" y="410" >Major has M3 / M6 / M7; natural minor lowers them to m3 / m6 / m7.</text>
</svg>
