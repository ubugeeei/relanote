<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Piano keyboard</title>
<desc id="desc">A piano makes the twelve semitone positions visible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs>
<style>
:root{color-scheme:light dark}.bg{fill:#fbfbfd}.panel{fill:#fff;stroke:#d8d8df}.soft{fill:#f2f2f7}.ink{fill:#17171b}.muted{fill:#6e6e73}.label{fill:#242428;font:650 16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.small{fill:#6e6e73;font:600 12px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.title{fill:#111115;font:760 34px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.desc{fill:#6e6e73;font:500 16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.mono{fill:#55555b;font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace}.axis{stroke:#8e8e93;stroke-width:1.5}.arrow{stroke:#55555b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{fill:none;stroke:#17171b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hot{stroke:#ff4f7a}.mint{stroke:#00a887}.gold{stroke:#c78800}.violet{stroke:#8e6bff}.hotf{fill:#ff4f7a}.mintf{fill:#00a887}.goldf{fill:#f2a900}.violetf{fill:#8e6bff}.darkf{fill:#242428}.lightf{fill:#fff}.fade{opacity:.22}.fillHot{fill:#ff4f7a;opacity:.12}.fillMint{fill:#00a887;opacity:.13}.fillGold{fill:#f2a900;opacity:.16}.fillViolet{fill:#8e6bff;opacity:.13}.mid{text-anchor:middle}.right{text-anchor:end}@media(prefers-color-scheme:dark){.bg{fill:#08090d}.panel{fill:#121319;stroke:#2d2e36}.soft{fill:#1b1c23}.ink,.title{fill:#f5f5f7}.muted,.desc,.small,.mono{fill:#a1a1aa}.label{fill:#f1f1f4}.axis{stroke:#696a73}.arrow{stroke:#bbbcc6}.line{stroke:#f5f5f7}.darkf{fill:#f5f5f7}.lightf{fill:#121319}}
</style>
<rect class="bg" width="960" height="540"/>
<text class="title" x="64" y="62" >Piano keyboard</text>
<text class="desc" x="66" y="92" >A piano makes the twelve semitone positions visible.</text>
<rect class="fillMint" x="90" y="220" width="52" height="150" rx="6"/><text class="small mid" x="116" y="348" >C</text><rect class="panel" x="142" y="220" width="52" height="150" rx="6"/><text class="small mid" x="168" y="348" >D</text><rect class="panel" x="194" y="220" width="52" height="150" rx="6"/><text class="small mid" x="220" y="348" >E</text><rect class="panel" x="246" y="220" width="52" height="150" rx="6"/><text class="small mid" x="272" y="348" >F</text><rect class="panel" x="298" y="220" width="52" height="150" rx="6"/><text class="small mid" x="324" y="348" >G</text><rect class="panel" x="350" y="220" width="52" height="150" rx="6"/><text class="small mid" x="376" y="348" >A</text><rect class="panel" x="402" y="220" width="52" height="150" rx="6"/><text class="small mid" x="428" y="348" >B</text><rect class="fillMint" x="454" y="220" width="52" height="150" rx="6"/><text class="small mid" x="480" y="348" >C</text><rect class="panel" x="506" y="220" width="52" height="150" rx="6"/><text class="small mid" x="532" y="348" >D</text><rect class="panel" x="558" y="220" width="52" height="150" rx="6"/><text class="small mid" x="584" y="348" >E</text><rect class="panel" x="610" y="220" width="52" height="150" rx="6"/><text class="small mid" x="636" y="348" >F</text><rect class="panel" x="662" y="220" width="52" height="150" rx="6"/><text class="small mid" x="688" y="348" >G</text><rect class="panel" x="714" y="220" width="52" height="150" rx="6"/><text class="small mid" x="740" y="348" >A</text><rect class="panel" x="766" y="220" width="52" height="150" rx="6"/><text class="small mid" x="792" y="348" >B</text><rect class="darkf" x="126" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="178" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="282" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="334" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="386" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="490" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="542" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="646" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="698" y="220" width="34" height="94" rx="5"/><rect class="darkf" x="750" y="220" width="34" height="94" rx="5"/><line class="arrow" x1="90" y1="392" x2="454" y2="392" /><text class="small mid" x="272" y="414" >12 semitones = one octave</text><line class="arrow" x1="90" y1="184" x2="454" y2="184" /><text class="small mid" x="272" y="174" >C4 261.63 Hz</text><line class="arrow" x1="454" y1="184" x2="818" y2="184" /><text class="small mid" x="636" y="174" >C5 523.25 Hz = 2x frequency</text>
</svg>
