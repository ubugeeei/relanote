<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Cutoff and brightness</title>
<desc id="desc">Lower cutoff removes more upper harmonics, so the tone gets darker.</desc>
