<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Circle of fifths</title>
<desc id="desc">Neighboring keys differ by one sharp or one flat.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs>
<style>
:root{color-scheme:light dark}.bg{fill:#fbfbfd}.panel{fill:#fff;stroke:#d8d8df}.soft{fill:#f2f2f7}.ink{fill:#17171b}.muted{fill:#6e6e73}.label{fill:#242428;font:650 16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.small{fill:#6e6e73;font:600 12px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.title{fill:#111115;font:760 34px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.desc{fill:#6e6e73;font:500 16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.mono{fill:#55555b;font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace}.axis{stroke:#8e8e93;stroke-width:1.5}.arrow{stroke:#55555b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{fill:none;stroke:#17171b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hot{stroke:#ff4f7a}.mint{stroke:#00a887}.gold{stroke:#c78800}.violet{stroke:#8e6bff}.hotf{fill:#ff4f7a}.mintf{fill:#00a887}.goldf{fill:#f2a900}.violetf{fill:#8e6bff}.darkf{fill:#242428}.lightf{fill:#fff}.fade{opacity:.22}.fillHot{fill:#ff4f7a;opacity:.12}.fillMint{fill:#00a887;opacity:.13}.fillGold{fill:#f2a900;opacity:.16}.fillViolet{fill:#8e6bff;opacity:.13}.mid{text-anchor:middle}.right{text-anchor:end}@media(prefers-color-scheme:dark){.bg{fill:#08090d}.panel{fill:#121319;stroke:#2d2e36}.soft{fill:#1b1c23}.ink,.title{fill:#f5f5f7}.muted,.desc,.small,.mono{fill:#a1a1aa}.label{fill:#f1f1f4}.axis{stroke:#696a73}.arrow{stroke:#bbbcc6}.line{stroke:#f5f5f7}.darkf{fill:#f5f5f7}.lightf{fill:#121319}}
</style>
<rect class="bg" width="960" height="540"/>
<text class="title" x="64" y="62" >Circle of fifths</text>
<text class="desc" x="66" y="92" >Neighboring keys differ by one sharp or one flat.</text>
<circle class="fillViolet" cx="480" cy="286" r="170"/><circle class="mintf" cx="480" cy="116" r="28"/><text class="small mid lightf" x="480" y="121" >C</text><circle class="mintf" cx="565" cy="138.7756813566454" r="28"/><text class="small mid lightf" x="565" y="143.7756813566454" >G</text><circle class="mintf" cx="627.2243186433545" cy="201" r="28"/><text class="small mid lightf" x="627.2243186433545" y="206" >D</text><circle class="mintf" cx="650" cy="286" r="28"/><text class="small mid lightf" x="650" y="291" >A</text><circle class="mintf" cx="627.2243186433545" cy="371" r="28"/><text class="small mid lightf" x="627.2243186433545" y="376" >E</text><circle class="mintf" cx="565" cy="433.2243186433546" r="28"/><text class="small mid lightf" x="565" y="438.2243186433546" >B</text><circle class="hotf" cx="480" cy="456" r="28"/><text class="small mid lightf" x="480" y="461" >F#/Gb</text><circle class="hotf" cx="395.00000000000006" cy="433.2243186433546" r="28"/><text class="small mid lightf" x="395.00000000000006" y="438.2243186433546" >Db</text><circle class="hotf" cx="332.77568135664546" cy="371.00000000000006" r="28"/><text class="small mid lightf" x="332.77568135664546" y="376.00000000000006" >Ab</text><circle class="hotf" cx="310" cy="286" r="28"/><text class="small mid lightf" x="310" y="291" >Eb</text><circle class="hotf" cx="332.77568135664546" cy="201" r="28"/><text class="small mid lightf" x="332.77568135664546" y="206" >Bb</text><circle class="hotf" cx="394.99999999999994" cy="138.77568135664546" r="28"/><text class="small mid lightf" x="394.99999999999994" y="143.77568135664546" >F</text><text class="label mid" x="480" y="282" >clockwise</text><text class="small mid" x="480" y="306" >+ one sharp</text><text class="small mid" x="480" y="470" >counter-clockwise adds flats; opposite keys are a tritone apart.</text><line class="arrow" x1="580" y1="126" x2="630" y2="168" /><line class="arrow" x1="380" y1="446" x2="330" y2="404" />
