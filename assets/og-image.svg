<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Relanote — music as a function">
  <!-- Paper -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Top bar: small lockup -->
  <g transform="translate(72, 64)">
    <!-- Mark, scaled to ~40px -->
    <g transform="scale(0.42)">
      <path d="M 38 86 Q 64 22 90 50" fill="none" stroke="#0F0F12" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="38" cy="86" r="7" fill="#0F0F12"/>
      <circle cx="90" cy="50" r="7" fill="#0F0F12"/>
    </g>
    <text x="76" y="44" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#0F0F12" letter-spacing="-0.2">relanote</text>
  </g>

  <!-- Hero wordmark -->
  <text x="72" y="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="200" font-weight="700" fill="#0F0F12" letter-spacing="-10">relanote</text>

  <!-- Tagline -->
  <text x="76" y="430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="38" font-weight="500" fill="#0F0F12" letter-spacing="-0.8">Everything is relative.</text>

  <!-- Accent rule: the only colour on the page -->
  <rect x="72" y="464" width="64" height="6" rx="3" fill="#FF5C35"/>

  <!-- Code line -->
  <g transform="translate(72, 530)">
    <text font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="22" fill="#0F0F12">
      <tspan fill="#71717A">let</tspan>
      <tspan> theme = | &lt;1&gt; &lt;3&gt; &lt;5&gt; |     theme </tspan>
      <tspan fill="#FF5C35">|&gt;</tspan>
      <tspan> transpose P5 </tspan>
      <tspan fill="#FF5C35">|&gt;</tspan>
      <tspan> repeat 2</tspan>
    </text>
  </g>
</svg>
