<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Relanote">
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>
  <!-- Two notes related by an interval. The arc reads as a slur / tie. -->
