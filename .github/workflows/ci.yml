name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: moon check
        working-directory: moonbit
        run: moon check

      - name: moon test
        working-directory: moonbit
        run: moon test

      - name: moon build
        working-directory: moonbit
        run: moon build

      - name: Vapor Moon playground
        working-directory: moonbit
        run: moon run .mooncakes/ubugeeei/vapor_moon/src/cmd/vapor_moon -- compile web/App.mbtv > /tmp/relanote-vapor-moon.snapshot
