name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check

      - name: implementation line limit
        run: |
          fail=0
          for f in $(git ls-files '*.mbt' '*.mbtv' '*.sh' '*.json' '*.yml' '*.yaml' '*.js' '*.mjs' '*.css' '*.html'); do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            if [ "$n" -gt 250 ]; then
              echo "$n $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: moon test
        run: moon test

      - name: native LSP tests
        run: moon test --target native -p ubugeeei/relanote/src/lsp -p ubugeeei/relanote/src/cmd

      - name: moon build
        run: moon build

      - name: LSP stdio smoke
        run: bash scripts/test_lsp_stdio.sh

      - name: coverage summary
        run: moon coverage analyze -- -f summary

      - name: Vapor Moon playground
        run: moon run .mooncakes/ubugeeei/vapor_moon/src/cmd/vapor_moon -- compile src/studio/App.mbtv > /tmp/relanote-vapor-moon.snapshot

      - name: static docs site
        run: node src/site/build.mjs
