name: Deploy to Void

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check MoonBit workspace
        run: |
          moon update
          vp run check
          vp run test

      # Vite Task builds docs, then `vp dlx void deploy` reads
      # `void.config.json` and publishes `dist/`.
      # otherwise defaults to publishing the working tree to Void's edge.
      # The token comes from a repository secret called `VOID_TOKEN`.
      - name: Deploy to Void
        run: vp run --no-cache deploy:void
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}
          VOID_PROJECT: relanote
