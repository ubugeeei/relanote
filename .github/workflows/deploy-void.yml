name: Deploy to Void

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check MoonBit workspace
        run: |
          moon update
          moon check
          moon test

      - name: Build static docs site
        run: node scripts/build_site.mjs

      # `npx void deploy` reads `void.config.json` and publishes `dist/`.
      # otherwise defaults to publishing the working tree to Void's edge.
      # The token comes from a repository secret called `VOID_TOKEN`.
      - name: Deploy to Void
        run: npx -y void deploy --project relanote --dir dist --spa
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}
          VOID_PROJECT: relanote
